apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmos3-nano-vllm
  namespace: cosmos
  labels:
    app: cosmos3-nano-vllm
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the node has exactly 1 GPU and the pod
  # requests 1. Under the default RollingUpdate, a new pod is created before
  # the old one terminates, but it can never schedule (no free GPU) — the
  # rollout deadlocks. Recreate tears the old pod down first. (Hit this live.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cosmos3-nano-vllm
  template:
    metadata:
      labels:
        app: cosmos3-nano-vllm
    spec:
      nodeSelector:
        workload: cosmos
        accelerator: nvidia

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      containers:
        - name: vllm
          # Linux AMD64 image digest resolved from vllm/vllm-omni:cosmos3 on
          # 2026-08-22. A digest prevents later tag updates from changing the
          # server build underneath this manifest.
          image: vllm/vllm-omni@sha256:970dee6658ea223f615b2438ce41e47f1d5322225482546e6e6bc5d8134f757c
          imagePullPolicy: IfNotPresent

          command:
            - "vllm"
            - "serve"
            - "nvidia/Cosmos3-Nano"
            # Hugging Face commit resolved on 2026-08-22. Keep this aligned
            # with scripts/11-verify-runtime.sh.
            - "--revision"
            - "411f42a8fdfb8c5b2583cb8786e0938f49796eaa"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--tensor-parallel-size"
            - "1"
            # L40S has ~21GB free for KV cache after weights; the model default
            # (262144) needs ~36GB and crashes engine init. 32768 fits and is
            # plenty for a PoC. Raise on larger-memory GPUs.
            - "--max-model-len"
            - "32768"
            # vLLM performs continuous batching by default. The selected c4
            # profile maintains four client-side requests without changing
            # scheduler or prefill defaults here.
            - "--allowed-local-media-path"
            - "/"
            - "--media-io-kwargs"
            - '{"video": {"num_frames": -1}}'

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: HF_HOME
              value: /cache/huggingface
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
                  optional: true
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
                  optional: true
            - name: VLLM_USE_DEEP_GEMM
              value: "0"

          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "6"
              memory: "48Gi"
              ephemeral-storage: "250Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "64Gi"
              ephemeral-storage: "450Gi"

          volumeMounts:
            - name: hf-cache
              mountPath: /cache/huggingface
            - name: shm
              mountPath: /dev/shm

          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 30
            failureThreshold: 120

          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 15
            failureThreshold: 8

          # Liveness/readiness are gated by the startupProbe above: while startup
          # is in progress Kubernetes disables both, so this only takes effect
          # once the server is already up. initialDelaySeconds is thus a belt-and-
          # suspenders margin, not the primary load-time budget.
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 900
            periodSeconds: 60
            failureThreshold: 5

      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 400Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
